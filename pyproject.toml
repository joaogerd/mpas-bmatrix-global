[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mpas-bmatrix-global"
version = "0.1.0"
description = "Workflow Python para preparar e executar MPAS global e pares NMC"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "João Gerd Zell de Mattos" }
]
license = { text = "MIT" }

dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.24",
  "netCDF4>=1.6",
  "cftime>=1.6",
  "xarray>=2024.1",
]

[project.optional-dependencies]
bflow = [
  "windspharm>=2.0",
  "xesmf>=0.9",
  "uxarray>=2025.0",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
mpaswf = "mpas_workflow.cli:main"
mpasbm = "mpas_workflow.bmatrix:main"
mpasbflow = "mpas_workflow.bflow:main"
mpasnmc = "mpas_workflow.nmc_core.cli:main"
mpasdirac-summary = "mpas_workflow.dirac_summary:main"
mpasverify = "mpas_workflow.verify:main"
mpasforecast = "mpas_workflow.mpas_core.cli:main"
mpasvbal = "mpas_workflow.vbal_core.cli:main"
mpashdiag = "mpas_workflow.hdiag_core.cli:main"
mpasnicas = "mpas_workflow.nicas_core.cli:main"
mpasso = "mpas_workflow.so_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
