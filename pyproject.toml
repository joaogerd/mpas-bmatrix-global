[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mpas-bmatrix-global"
version = "0.1.0"
description = "Workflow Python para preparar e executar MPAS global e pares NMC"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "João Gerd Zell de Mattos" }
]
license = { text = "MIT" }

dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.24",
  "netCDF4>=1.6",
  "cftime>=1.6",
  "xarray>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
mpas-render = "mpas_workflow.case_render_cli:main"
mpaswf = "mpas_workflow.cli:main"
mpaswf-cycle-range = "mpas_workflow.cycle_range:main"
mpasbm = "mpas_workflow.bmatrix:main"
mpasbflow = "mpas_workflow.bflow_configured:main"
mpasbflow-legacy = "mpas_workflow.bflow:main"
mpasbcov = "mpas_workflow.bcov_bflow_configured:main"
mpasbcov-contract = "mpas_workflow.bcov_configured:main"
mpasbcov-legacy = "mpas_workflow.bcov:main"
mpasbcov-pipeline = "mpas_workflow.bcov_pipeline:main"
mpasdirac-summary = "mpas_workflow.dirac_summary:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
