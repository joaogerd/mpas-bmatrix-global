# =============================================================================
# Site: JACI
# =============================================================================
#
# Propósito
# ---------
# Define exclusivamente a infraestrutura compartilhada do ambiente JACI:
# caminhos de projeto, instalação MPAS, catálogo de malhas e dados WPS_GEOG.
#
# Quem altera este arquivo?
# -------------------------
# Mantenedores do ambiente ou do repositório. Usuários de experimentos MPAS
# normalmente não devem editar este arquivo; devem alterar arquivos em
# configs/mpas/cases/.
#
# Os valores entre chaves, por exemplo {project_root}, são placeholders
# resolvidos pelo renderer antes de gerar namelist e streams.
# =============================================================================

# Identifica o formato e permite validações futuras de configuração de site.
schema: workflow-site/v1

site:
  # Nome lógico do ambiente. Não é um hostname.
  name: jaci
  # Agendador usado quando uma camada posterior preparar jobs de execução.
  scheduler: pbs

# Contexto compartilhado por todos os casos que incluem este site.
context:
  # Raiz pessoal de projetos no filesystem compartilhado do JACI.
  project_root: "/p/projetos/monan_das/$USER"

  # Diretório-base para produtos temporários e resultados de workflows.
  workspace_root: "{project_root}/work"
  # Diretório-base para dados persistentes usados pelos experimentos.
  data_workspace_root: "{project_root}/data"

  # Catálogo institucional de malhas MPAS quasi-uniformes.
  mesh_catalog_root: "{project_root}/projects/mpas_meshes/quasi_uniform"

  # Dados geográficos WPS locais para a etapa static do MPAS.
  # Não deve apontar para o caminho /glade presente em alguns templates NCAR.
  wps_geog_data_path: "{data_workspace_root}/mpas-bmatrix-global/external/WPS_GEOG/low_res_mandatory/WPS_GEOG_LOW_RES"

# Layout padrão de uma instalação MPAS. O Python expõe internamente:
# - {mpas_install_root}
# - {mpas_init_executable}
# - {mpas_atmosphere_executable}
# - {init_share}
# - {atmosphere_share}
# Entradas absolutas opcionais, por exemplo mpas_atmosphere: /outro/bin/mpas_atmosphere,
# sobrescrevem somente aquela chave e não usam root.
install:
  root: "{project_root}/builds/monan-jedi-mpas"
