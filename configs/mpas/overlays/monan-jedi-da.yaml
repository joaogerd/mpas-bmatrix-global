# Overlay for a JEDI-enabled MPAS-Atmosphere build.
# It extends a plain MPAS case only with the DA-state output stream.
context:
  da_state_filename: "mpasout.$Y-$M-$D_$h.$m.$s.nc"

stages:
  forecast:
    streams:
      streams:
        da_state:
          create: true
          tag: stream
          attributes:
            type: output
            precision: single
            io_type: pnetcdf,cdf5
            packages: jedi_da
            filename_template: "{da_state_filename}"
            filename_interval: output_interval
            output_interval: "{output_interval}"
            clobber_mode: overwrite
