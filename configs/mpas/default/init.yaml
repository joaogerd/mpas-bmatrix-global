stages:
  init:
    output_dir: "{render_root}/init/{safe_time}"
    namelist:
      template: "{init_share}/namelist.init_atmosphere"
      output: namelist.init_atmosphere
      groups:
        nhyd_model:
          config_init_case: 7
          config_start_time: "'{init_time}'"
          config_stop_time: "'{init_time}'"
        dimensions:
          config_nvertlevels: "{nvertlevels}"
        data_sources:
          config_met_prefix: "'FILE'"
          config_sfc_prefix: "'FILE'"
        decomposition:
          config_block_decomp_file_prefix: "'{graph_basename}.part.'"
        preproc_stages:
          config_static_interp: false
          config_native_gwd_static: false
          config_native_gwd_gsl_static: false
          config_vertical_grid: true
          config_met_interp: true
    streams:
      template: "{init_share}/streams.init_atmosphere"
      output: streams.init_atmosphere
      streams:
        input:
          attributes:
            filename_template: "{static_output_name}"
            input_interval: initial_only
        output:
          attributes:
            filename_template: "{init_output_name}"
            clobber_mode: overwrite
        ugwp_oro_data:
          attributes:
            filename_template: "{ugwp_oro_output_name}"
        surface:
          attributes:
            filename_template: "{surface_update_output_name}"
