# =============================================================================
# MPAS runtime defaults: forecast
# =============================================================================
#
# Propósito
# ---------
# Declara como montar uma integração MPAS a partir de static.nc e init.nc já
# produzidos. O preparador não executa mpas_atmosphere; ele somente cria links
# reproduzíveis, valida insumos e registra o manifesto de runtime.
# =============================================================================

stages:
  forecast:
    runtime:
      output_dir: "{runtime_root}/forecast/{safe_time}/f{lead_hours:03d}_dt{dt}_np{nproc}"
      executable:
        source: "{mpas_atmosphere_executable}"
        destination: mpas_atmosphere
      links:
        # Artefatos renderizados do forecast.
        - source: "{render_root}/forecast/{safe_time}/f{lead_hours:03d}_dt{dt}_np{nproc}/namelist.atmosphere"
          destination: namelist.atmosphere
        - source: "{render_root}/forecast/{safe_time}/f{lead_hours:03d}_dt{dt}_np{nproc}/streams.atmosphere"
          destination: streams.atmosphere
        # Produtos de static e init do mesmo caso/ciclo.
        - source: "{runtime_root}/static/{static_output_name}"
          destination: "{static_output_name}"
        - source: "{runtime_root}/static/{surface_update_output_name}"
          destination: "{surface_update_output_name}"
        - source: "{runtime_root}/static/{ugwp_oro_output_name}"
          destination: "{ugwp_oro_output_name}"
        - source: "{runtime_root}/init/{safe_time}/{init_output_name}"
          destination: "{init_output_name}"
        # Grafo e partição necessários para a execução MPI.
        - source: "{graph_path}"
          destination: "{graph_basename}"
        - source: "{partition_path}"
          destination: "{graph_basename}.part.{nproc}"
      expected_outputs:
        # O primeiro restart esperado para o intervalo de saída configurado.
        - "{restart_filename}"
