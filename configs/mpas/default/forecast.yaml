# =============================================================================
# MPAS defaults: estágio forecast
# =============================================================================
#
# Propósito
# ---------
# Define a configuração padrão de uma integração MPAS-Atmosphere global. O
# estágio consome static.nc e init.nc já preparados, renderiza namelist e
# streams, e deixa o diretório pronto para uma camada posterior criar links,
# submeter PBS e executar mpas_atmosphere.
#
# O arquivo contém detalhes do contrato do template MPAS instalado: grupos
# Fortran, conversão do stream restart e streams opcionais desativados. Mude-os
# apenas quando houver uma razão científica ou uma atualização comprovada do
# template/build MPAS.
# =============================================================================

stages:
  forecast:
    # Um diretório por ciclo, lead, dt e nproc evita colisão entre experimentos.
    output_dir: "{render_root}/forecast/{safe_time}/f{lead_hours:03d}_dt{dt}_np{nproc}"

    # Namelist do executável mpas_atmosphere.
    namelist:
      template: "{atmosphere_share}/namelist.atmosphere"
      output: namelist.atmosphere
      groups:
        nhyd_model:
          # Passo de tempo fornecido na linha de comando ou pelo experimento.
          config_dt: "{dt}.0"
          # Início da integração e duração calculada a partir de lead_hours.
          config_start_time: "'{init_time}'"
          config_run_duration: "'{run_duration}'"
          # Escala horizontal de referência, coerente com a malha do caso base.
          config_len_disp: "240000.0"
        restart:
          # O caso base começa a partir de init.nc, não de um restart anterior.
          config_do_restart: false
        decomposition:
          # Prefixo do arquivo de partição correspondente a nproc.
          config_block_decomp_file_prefix: "'{graph_basename}.part.'"
        damping:
          # Amortecimento moderno do build MPAS atual. Estes valores podem ser
          # sobrescritos em um caso que tenha justificativa científica.
          config_epssm_minimum: "0.1"
          config_epssm_maximum: "0.5"
          config_epssm_transition_bottom_z: "30000."
          config_epssm_transition_top_z: "50000."

    # Streams XML do mpas_atmosphere.
    streams:
      template: "{atmosphere_share}/streams.atmosphere"
      output: streams.atmosphere
      streams:
        invariant:
          attributes:
            # Campos invariantes/estáticos gerados pelo estágio static.
            filename_template: "{static_output_name}"
            input_interval: initial_only
        input:
          attributes:
            # Estado inicial atmosférico datado produzido pelo estágio init.
            filename_template: "{init_output_name}"
            input_interval: initial_only
        surface:
          attributes:
            # Produto de superfície compatível com a mesma malha.
            filename_template: "{surface_update_output_name}"
        ugwp_oro_data_in:
          attributes:
            # Produto orográfico auxiliar da física UGWP.
            filename_template: "{ugwp_oro_output_name}"

        # IAU não pertence ao caso MPAS puro. O stream continua presente no
        # template, mas é desativado sem remover sua definição XML.
        iau:
          tag: stream
          attributes:
            type: none
            packages: null
            filename_template: null
            filename_interval: null
            input_interval: null
            output_interval: null

        # da_state é específico de MONAN-JEDI. O overlay monan-jedi.yaml o
        # reativa explicitamente quando o experimento precisar desse produto.
        da_state:
          tag: stream
          attributes:
            type: none
            packages: null
            precision: null
            io_type: null
            filename_template: null
            filename_interval: null
            input_interval: null
            output_interval: null
            clobber_mode: null

        restart:
          # Alguns templates declaram restart como immutable_stream de entrada.
          # A tag explícita autoriza o renderer a convertê-lo em saída dinâmica.
          tag: stream
          attributes:
            type: output
            filename_template: "{restart_filename}"
            filename_interval: output_interval
            output_interval: "{output_interval}"
            clobber_mode: overwrite
