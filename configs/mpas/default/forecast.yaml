stages:
  forecast:
    output_dir: "{render_root}/forecast/{safe_time}/f{lead_hours:03d}_dt{dt}_np{nproc}"
    namelist:
      template: "{atmosphere_share}/namelist.atmosphere"
      output: namelist.atmosphere
      groups:
        nhyd_model:
          config_dt: "{dt}.0"
          config_start_time: "'{init_time}'"
          config_run_duration: "'{run_duration}'"
          config_len_disp: "240000.0"
        restart:
          config_do_restart: false
        decomposition:
          config_block_decomp_file_prefix: "'{graph_basename}.part.'"
        damping:
          config_epssm_minimum: "0.1"
          config_epssm_maximum: "0.5"
          config_epssm_transition_bottom_z: "30000."
          config_epssm_transition_top_z: "50000."
    streams:
      template: "{atmosphere_share}/streams.atmosphere"
      output: streams.atmosphere
      streams:
        invariant:
          attributes:
            filename_template: "{static_output_name}"
            input_interval: initial_only
        input:
          attributes:
            filename_template: "{init_output_name}"
            input_interval: initial_only
        surface:
          attributes:
            filename_template: "{surface_update_output_name}"
        ugwp_oro_data_in:
          attributes:
            filename_template: "{ugwp_oro_output_name}"
        iau:
          tag: stream
          attributes:
            type: none
            packages: null
            filename_template: null
            filename_interval: null
            input_interval: null
            output_interval: null
        da_state:
          tag: stream
          attributes:
            type: none
            packages: null
            precision: null
            io_type: null
            filename_template: null
            filename_interval: null
            input_interval: null
            output_interval: null
            clobber_mode: null
        restart:
          tag: stream
          attributes:
            type: output
            filename_template: "{restart_filename}"
            filename_interval: output_interval
            output_interval: "{output_interval}"
            clobber_mode: overwrite
