includes:
  - ../../defaults/mpas-atmosphere.yaml
  - ../../sites/jaci.yaml

case:
  name: global-x1.10242
  description: Global quasi-uniform x1.10242 MPAS-Atmosphere case

context:
  mesh_name: x1.10242
  mesh_resolution_km: 240
  nproc: 128
  nvertlevels: 55
  mesh_root: "{mesh_catalog_root}/x1.10242_240km"
  grid_path: "{mesh_root}/mesh/x1.10242.grid.nc"
  grid_local_name: "x1.10242.grid.nc"
  graph_path: "{mesh_root}/graph/x1.10242.graph.info"
  graph_basename: "x1.10242.graph.info"
  partitions_dir: "{mesh_root}/partitions"
  partition_path: "{partitions_dir}/{graph_basename}.part.{nproc}"
  static_output_name: "x1.10242.static.nc"
  init_output_name: "x1.10242.init.{safe_time}.nc"
  render_root: "{work_root}/mpas-rendered/{case_name}"

stages:
  static:
    output_dir: "{render_root}/static"
    namelist:
      template: "{init_share}/namelist.init_atmosphere"
      output: namelist.init_atmosphere
      groups:
        nhyd_model:
          config_init_case: 7
          config_start_time: "'{init_time}'"
          config_stop_time: "'{init_time}'"
          config_nvertlevels: "{nvertlevels}"
          config_block_decomp_file_prefix: "'{graph_basename}.part.'"
          config_static_interp: true
          config_native_gwd_static: true
          config_native_gwd_gsl_static: false
          config_vertical_grid: false
          config_met_interp: false
    streams:
      template: "{init_share}/streams.init_atmosphere"
      output: streams.init_atmosphere
      streams:
        input:
          attributes:
            type: input
            input_interval: initial_only
            filename_template: "{grid_local_name}"
        output:
          attributes:
            type: output
            filename_template: "{static_output_name}"
            clobber_mode: overwrite

  init:
    output_dir: "{render_root}/init/{safe_time}"
    namelist:
      template: "{init_share}/namelist.init_atmosphere"
      output: namelist.init_atmosphere
      groups:
        nhyd_model:
          config_init_case: 7
          config_start_time: "'{init_time}'"
          config_stop_time: "'{init_time}'"
          config_nvertlevels: "{nvertlevels}"
          config_block_decomp_file_prefix: "'{graph_basename}.part.'"
          config_met_prefix: "'FILE'"
          config_sfc_prefix: "'FILE'"
          config_static_interp: false
          config_native_gwd_static: false
          config_native_gwd_gsl_static: false
          config_vertical_grid: true
          config_met_interp: true
    streams:
      template: "{init_share}/streams.init_atmosphere"
      output: streams.init_atmosphere
      streams:
        input:
          attributes:
            type: input
            input_interval: initial_only
            filename_template: "{static_output_name}"
        output:
          attributes:
            type: output
            filename_template: "{init_output_name}"
            clobber_mode: overwrite

  forecast:
    output_dir: "{render_root}/forecast/{safe_time}/f{lead_hours:03d}_dt{dt}_np{nproc}"
    namelist:
      template: "{atmosphere_share}/namelist.atmosphere"
      output: namelist.atmosphere
      groups:
        nhyd_model:
          config_dt: "{dt}.0"
          config_start_time: "'{init_time}'"
          config_run_duration: "'{run_duration}'"
          config_block_decomp_file_prefix: "'{graph_basename}.part.'"
          config_len_disp: "240000.0"
          config_do_restart: false
        damping:
          config_epssm_minimum: "0.1"
          config_epssm_maximum: "0.5"
          config_epssm_transition_bottom_z: "30000."
          config_epssm_transition_top_z: "50000."
    streams:
      template: "{atmosphere_share}/streams.atmosphere"
      output: streams.atmosphere
      streams:
        invariant:
          attributes:
            type: input
            input_interval: initial_only
            filename_template: "{static_output_name}"
        input:
          attributes:
            type: input
            input_interval: initial_only
            filename_template: "{init_output_name}"
        restart:
          create: true
          tag: stream
          attributes:
            type: output
            filename_template: "{restart_filename}"
            filename_interval: output_interval
            output_interval: "{output_interval}"
            clobber_mode: overwrite
