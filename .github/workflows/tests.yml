name: Tests

on:
  pull_request:
  push:
    branches:
      - refactor/bflow-python-pipeline

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest
      - name: Check public CLIs
        run: |
          mpasforecast --help
          mpasbflow --help
          mpasnmc --help
          mpaswf migration
